name: file_convertor
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  local_auth: ^2.2.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  # Discovery
  udp: ^5.0.3
  multicast_dns: ^0.3.2
  # Networking
  network_info_plus: ^5.0.0
  path_provider: ^2.1.2
  # QR
  qr_flutter: ^4.1.0
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  open_filex: ^5.0.0
  package_info_plus: ^9.0.1
  image: ^4.3.0
  pdf: ^3.12.0
  archive: ^3.6.1
  csv: ^8.0.0
  xml: ^6.6.1
  markdown: ^7.3.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  widgetbook: ^3.25.0
  accessibility_tools: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
